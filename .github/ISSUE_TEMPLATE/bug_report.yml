name: Bug report
description: Report a reproducible problem with the application
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please **do not** report security
        vulnerabilities here — see [SECURITY.md](https://github.com/armand-vw/Canary-Token-Generator/blob/main/SECURITY.md).
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to 'Generate Tokens'
        2. Select 'Decoy PDF'
        3. Click '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and OS
      placeholder: e.g. Chrome 129 on macOS 14
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console / network output
      description: Paste any errors from the browser console or network tab (redact secrets and webhook URLs).
      render: text
    validations:
      required: false
