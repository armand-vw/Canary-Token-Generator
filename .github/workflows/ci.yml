name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Lint · typecheck · test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Typecheck (JSDoc)
        run: npm run typecheck

      - name: Run tests
        run: npm run test

      - name: Verify compiled CSS is committed and up to date
        run: |
          npm run build:css
          if ! git diff --quiet -- assets/css/styles.css; then
            echo "::error::assets/css/styles.css is out of date. Run 'npm run build:css' and commit the result."
            git --no-pager diff -- assets/css/styles.css | head -60
            exit 1
          fi
          echo "Compiled CSS is up to date."
