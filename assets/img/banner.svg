<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Canary Token Generator">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020617" />
      <stop offset="1" stop-color="#0b1220" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#3b82f6" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#1e293b" stroke-width="1" opacity=".55" />
    </pattern>
  </defs>

  <rect width="1200" height="320" rx="20" fill="url(#bg)" />
  <rect width="1200" height="320" rx="20" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="19" fill="none" stroke="#1e293b" />

  <g transform="translate(80 84)">
    <rect width="152" height="152" rx="30" fill="#0f172a" stroke="#1e293b" />
    <path d="M76 22 122 42v32c0 28-19 48.5-46 56-27-7.5-46-28-46-56V42L76 22Z"
          fill="none" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round" />
    <circle cx="76" cy="70" r="8" fill="url(#accent)" />
    <path d="M76 70 107 49" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" />
    <path d="M58 70a18 18 0 0 1 18-18" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity=".85" />
    <path d="M47 70a29 29 0 0 1 29-29" fill="none" stroke="#22d3ee" stroke-width="4" stroke-linecap="round" opacity=".45" />
  </g>

  <text x="280" y="150" fill="#f1f5f9" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="60" font-weight="700" letter-spacing="-1">
    Canary Token Generator
  </text>
  <text x="282" y="200" fill="#94a3b8" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, sans-serif" font-size="26" font-weight="400">
    Client-side decoy tokens for breach &amp; intrusion detection
  </text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20" text-anchor="middle">
    <rect x="282" y="228" width="274" height="42" rx="21" fill="#0e7490" opacity=".22" stroke="#155e75" />
    <text x="409" y="256" fill="#67e8f9">100% client-side</text>
    <rect x="572" y="228" width="182" height="42" rx="21" fill="#0e7490" opacity=".22" stroke="#155e75" />
    <text x="663" y="256" fill="#67e8f9">No sign-up</text>
    <rect x="770" y="228" width="208" height="42" rx="21" fill="#0e7490" opacity=".22" stroke="#155e75" />
    <text x="874" y="256" fill="#67e8f9">GitHub Pages</text>
  </g>
</svg>
